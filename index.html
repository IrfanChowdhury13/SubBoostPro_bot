<!DOCTYPE html>
<html>
<head>
  <title>SubBoost Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- LOGIN / REGISTER -->
<div id="authPage" class="flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded-2xl shadow w-80">

    <h1 class="text-2xl font-bold text-center mb-4">SubBoost Pro</h1>

    <input id="name" placeholder="Enter Name" class="w-full border p-2 rounded mb-2">
    <input id="password" type="password" placeholder="Enter Password" class="w-full border p-2 rounded mb-3">

    <button onclick="login()" class="w-full bg-black text-white py-2 rounded mb-2 required">Login</button>
    <button onclick="register()" class="w-full bg-blue-500 text-white py-2 rounded required">Register</button>

    <p id="msg" class="text-center text-sm mt-2 text-red-500"></p>

  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden p-4 max-w-md mx-auto">

  <h1 class="text-2xl font-bold text-center">SubBoost Pro</h1>

  <div class="mt-4 bg-white p-4 rounded-xl shadow">
    <p><b>Name:</b> <span id="d_name"></span></p>
    <p><b>UID:</b> <span id="d_uid"></span></p>
  </div>

  <div class="mt-4 bg-blue-500 text-white p-4 rounded-xl text-center">
    <h2>Total Points</h2>
    <p id="points">0</p>
  </div>

  <div class="mt-4 flex gap-2">
    <button onclick="showTasks()" class="flex-1 bg-black text-white py-2 rounded">Tasks</button>
    <button onclick="showServices()" class="flex-1 bg-gray-300 py-2 rounded">Services</button>
  </div>

  <div id="content" class="mt-4"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbz4Xst9BLkU8DOi4XJnfkW7oyOq6KEMFNx9uCaH07LPfS1shi7l8ZeiuAJblDXSmMepmg/exec";

function login() {
  const name = document.getElementById("name").value;
  const password = document.getElementById("password").value;

  fetch(`${API}?action=login&name=${name}&password=${password}`)
    .then(res => res.json())
    .then(data => {
      if(data.status === "success"){
        localStorage.setItem("uid", data.uid);
        localStorage.setItem("name", data.name);
        showDashboard();
      } else {
        document.getElementById("msg").innerText = data.message;
      }
    });
}

function register() {
  const name = document.getElementById("name").value;
  const password = document.getElementById("password").value;

  fetch(`${API}?action=register&name=${name}&password=${password}`)
    .then(res => res.json())
    .then(data => {
      if(data.status === "success"){
        alert("Registered সফল! এখন login করো");
      } else {
        document.getElementById("msg").innerText = data.message;
      }
    });
}

function showDashboard() {
  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("d_name").innerText = localStorage.getItem("name");
  document.getElementById("d_uid").innerText = localStorage.getItem("uid");

  loadUser();
}

function loadUser() {
  const uid = localStorage.getItem("uid");

  fetch(`${API}?action=getUser&uid=${uid}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("points").innerText = data.points || 0;
    });
}

function showTasks() {
  document.getElementById("content").innerHTML = `
    <div class="bg-white p-4 rounded-xl shadow">
      
      <h2 class="text-lg font-bold">Watch Video</h2>
      
      <div id="videoList" class="mt-3 space-y-2"></div>

    </div>

    <div class="bg-white p-4 rounded-xl shadow mt-3">
      <h2 class="text-lg font-bold">Do Subscribe</h2>
      <button class="bg-blue-500 text-white px-4 py-2 mt-2 rounded w-full">
        Click Here
      </button>
    </div>
  `;

  loadVideos();
}

const videos = [
  { id: 1, title: "Video 1", link: "https://youtube.com/shorts/r4w32lZggBE?si=uSX9reKL0ISvuBQ7" },
  { id: 2, title: "Video 2", link: "https://youtube.com/shorts/rR_fKP3VqLg?si=RkV6jnEBlb68gbug" }
];
  

  function loadVideos() {
  const container = document.getElementById("videoList");

  videos.forEach(v => {
    container.innerHTML += `
      <div class="p-3 border rounded flex justify-between items-center">
        <span>${v.title}</span>
        <button onclick="watchVideo('${v.link}', ${v.id})"
          class="bg-green-500 text-white px-3 py-1 rounded">
          Click Here
        </button>
      </div>
    `;
  });
}

function watchVideo(link, id) {
  let startTime = Date.now();

  const popup = window.open(link, "_blank");

  let checkInterval = setInterval(() => {

    // if popup closed
    if (popup.closed) {
      clearInterval(checkInterval);
      alert("❌ Video incomplete");
      return;
    }

    let watchedTime = Date.now() - startTime;

    // 10 sec = minimum (tumi change korte parba)
    if (watchedTime > 10000) {
      clearInterval(checkInterval);

      popup.close();
      completeTask(id);
    }

  }, 1000);
}

function completeTask(id) {
  const btns = document.querySelectorAll("button");

  btns.forEach(btn => {
    if (btn.innerText === "Click Here") {
      btn.disabled = true;
      btn.innerText = "Completed";
      btn.classList.add("bg-gray-400");
    }
  });

  addPoints(10); // each video 10 points
}

  if (action === "addPoints") {
  const uid = e.parameter.uid;
  const points = Number(e.parameter.points);

  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Users");
  const data = sheet.getDataRange().getValues();

  for (let i = 1; i < data.length; i++) {
    if (data[i][0] == uid) {
      let current = data[i][3] || 0;
      sheet.getRange(i + 1, 4).setValue(current + points);
      break;
    }
  }

  return ContentService.createTextOutput("Points Added");
}
  
function showServices() {
  document.getElementById("content").innerHTML = "Coming Soon";
}
  

function openTask(id) {
  document.getElementById("content").innerHTML = `
    <input type="file" id="file" class="w-full mb-2">
    <button onclick="submitTask(${id})" class="bg-green-500 text-white px-4 py-2 rounded w-full">Submit</button>
  `;
}

function submitTask(taskId) {
  const file = document.getElementById("file").files[0];
  const reader = new FileReader();

  reader.onload = function() {
    fetch(`${API}?action=submit&uid=${localStorage.getItem("uid")}&task=${taskId}&img=${encodeURIComponent(reader.result)}`)
      .then(() => alert("Submitted"));
  };

  reader.readAsDataURL(file);
}

if(localStorage.getItem("uid")){
  showDashboard();
}
</script>

</body>
</html>
