<!DOCTYPE html>
<html>
<head>
  <title>SubBoost Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="p-4">
  <h1 class="text-2xl font-bold">SubBoost Pro</h1>

  <!-- User Info -->
  <div class="mt-4 bg-white p-4 rounded-xl shadow">
    <p>Name: <span id="name"></span></p>
    <p>UID: <span id="uid"></span></p>
  </div>

  <!-- Points Card -->
  <div class="mt-4 bg-blue-500 text-white p-4 rounded-xl">
    <h2>Total Points</h2>
    <p id="points">0</p>
  </div>

  <!-- Tabs -->
  <div class="mt-4 flex gap-2">
    <button onclick="showTasks()" class="bg-black text-white px-4 py-2 rounded">Tasks</button>
    <button onclick="showServices()" class="bg-gray-300 px-4 py-2 rounded">Services</button>
  </div>

  <!-- Content -->
  <div id="content" class="mt-4"></div>
</div>

<script>
const API = "YOUR_GOOGLE_SCRIPT_URL";

function loadUser() {
  const uid = localStorage.getItem("uid");

  fetch(API + "?action=getUser&uid=" + uid)
    .then(res => res.json())
    .then(data => {
      document.getElementById("name").innerText = data[1];
      document.getElementById("uid").innerText = data[0];
      document.getElementById("points").innerText = data[3];
    });
}

function showTasks() {
  document.getElementById("content").innerHTML = `
    <div class="bg-white p-4 rounded shadow">
      <h2>Watch Video</h2>
    </div>
    <div class="bg-white p-4 rounded shadow mt-2">
      <h2>Subscribe Channel</h2>
    </div>
  `;
}

function showServices() {
  document.getElementById("content").innerHTML = `
    <div class="text-center text-gray-500">Coming Soon</div>
  `;
}

loadUser();
</script>

</body>
</html>
